name: OAuth dependency lock refresh
on:
  push:
    branches:
      - feature/osved-oauth-vault-20261022
    paths:
      - .github/workflows/oauth-lock-refresh.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-lock:
    if: github.repository == 'TimaBak/osved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - run: uv lock
      - name: Commit updated uv.lock
        run: |
          git add uv.lock
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: refresh uv.lock for OAuth encryption"
          git push origin HEAD:feature/osved-oauth-vault-20261022
