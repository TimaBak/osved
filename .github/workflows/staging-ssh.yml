name: Staging SSH deployment

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: osved-staging-ssh
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'TimaBak/osved' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'TimaBak/osved' &&
        github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Validate source commit and SSH deployment configuration
        env:
          COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HOST: ${{ vars.OSVED_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.OSVED_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.OSVED_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OSVED_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          echo "Deploying reviewed main commit $COMMIT to staging"
      - name: Verify completed main Checks for manual deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&status=success&per_page=30")
          jq -e --arg sha "$COMMIT" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success")] | length > 0' <<< "$runs" >/dev/null || {
            echo "Refusing manual release: main commit has no successful Checks run."
            exit 1
          }
      - name: Submit exact SHA to restricted SSH account
        env:
          COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HOST: ${{ vars.OSVED_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.OSVED_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.OSVED_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OSVED_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          key_file=$(mktemp "$HOME/.ssh/osved_key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$COMMIT" | ssh \
            -F /dev/null \
            -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST"
