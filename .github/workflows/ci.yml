name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.9.11
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check app tests
      - run: uv run --frozen pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t osved:ci .
      - run: docker run --rm osved:ci osved doctor

  staging_request:
    name: Request staging release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, container]
    runs-on: [self-hosted, Linux, X64, osved-deploy]
    environment: staging
    permissions:
      contents: read
    concurrency:
      group: osved-staging
      cancel-in-progress: false
    steps:
      - name: Submit an unprivileged deployment request
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$RELEASE_REPO" = "TimaBak/osved"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          umask 077
          request_dir=/var/lib/osved-deploy-requests
          test -d "$request_dir"
          request_file=$(mktemp "$request_dir/request.XXXXXXXXXX")
          printf '%s\\n' "$RELEASE_SHA" > "$request_file"
          echo "Deployment request queued for $RELEASE_SHA; privileged deploy service is not yet enabled."
