name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.9.11
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check app tests
      - run: uv run --frozen pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t osved:ci .
      - run: docker run --rm osved:ci osved doctor

  deploy:
    name: Deploy to dedicated OSVED VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, container]
    runs-on: [self-hosted, Linux, X64, osved-deploy]
    environment: production
    permissions:
      contents: read
    concurrency:
      group: osved-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy checked main commit
        shell: bash
        run: bash deploy/deploy-osved.sh
