name: OSVED public HTTPS smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Staging SSH deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: osved-public-https-smoke
  cancel-in-progress: false

jobs:
  public-smoke:
    if: >-
      github.repository == 'TimaBak/osved' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'TimaBak/osved' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify public TLS and owner-only API
        shell: bash
        run: |
          set -euo pipefail
          url='https://osved.tima.biz'
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT

          status=$(curl --silent --show-error --max-time 15 --retry 2 \
            --output "$body" --write-out '%{http_code}' "$url/healthz")
          test "$status" = 200 || {
            echo "HTTPS health failed: HTTP $status" >&2
            exit 1
          }
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"alive"' "$body" || {
            echo "HTTPS health response was unexpected" >&2
            exit 1
          }

          status=$(curl --silent --show-error --max-time 15 \
            --output "$body" --write-out '%{http_code}' "$url/")
          test "$status" = 200 || {
            echo "OSVED dashboard not reachable: HTTP $status" >&2
            exit 1
          }
          grep -Fq 'ОСВЕД' "$body" || {
            echo "Unexpected dashboard HTML" >&2
            exit 1
          }

          status=$(curl --silent --show-error --max-time 15 \
            --output "$body" --write-out '%{http_code}' "$url/api/overview")
          test "$status" = 401 || {
            echo "Private API must return HTTP 401, got $status" >&2
            exit 1
          }
          echo 'External TLS health, HTML dashboard, and anonymous API deny: PASS' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Check actual browser visibility and navigation (Chromium mobile)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
          node tests/browser/portal-smoke.cjs
